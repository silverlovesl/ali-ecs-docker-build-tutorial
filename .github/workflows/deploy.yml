# =============================================================================
#  CI/CD: push to main -> lint & test -> build & push to ACR -> deploy on ECS
#
#  Flow:
#    GitHub push
#      -> GitHub Actions: docker build (one image: API + SPA)
#      -> push image to ACR (tags: latest + github.sha)
#      -> SSH to ECS
#      -> docker login ACR
#      -> docker pull image (by github.sha tag)
#      -> docker compose up -d (recreates the container)
#      -> health check (JSON API + SPA shell)
#
#  Secrets must be configured in the GitHub environment named `prod`
#  (Settings -> Environments -> prod), which the `build` and `deploy` jobs
#  declare via `environment: prod`. Repository-level secrets also work.
#
#    ECS_HOST        public IP of the ECS, e.g. 47.xx.xx.xx
#    ECS_USER        SSH user, e.g. root or a deploy user
#    ECS_SSH_KEY     private key whose pubkey is in ~/.ssh/authorized_keys
#    ECS_PORT        (optional) SSH port, defaults to 22
#    ACR_REGISTRY    e.g. registry.cn-hangzhou.aliyuncs.com/my-namespace
#    ACR_USERNAME    ACR username (set in ACR console -> Access Credentials)
#    ACR_PASSWORD    ACR password (fixed password or RAM user credential)
#
#  ACR prerequisites: create ONE private repository under the namespace:
#    ali-ecs-docker-build-tutorial-api -> full image: $ACR_REGISTRY/ali-ecs-docker-build-tutorial-api:<tag>
#  It serves both the SPA and the JSON API (the Go server also serves the built
#  frontend), so a second repository is no longer needed.
# =============================================================================
name: CI/CD

on:
  push:
    branches: [feat/auto-deploy, main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_TAG: ${{ github.sha }}
  DEPLOY_DIR: ~/app

# NOTE: IMAGE is defined per job, not here. It embeds secrets.ACR_REGISTRY, and
# environment secrets are only readable inside a job that declares that
# environment (see the `environment: prod` keys below).

jobs:
  check:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

  build:
    name: Build & Push to ACR
    runs-on: ubuntu-latest
    needs: check
    # Required: the ACR credentials live in the `prod` environment.
    # If a protection rule requires reviewers, it will also gate this job.
    environment: prod
    env:
      IMAGE: ${{ secrets.ACR_REGISTRY }}/ali-ecs-docker-build-tutorial-api
    steps:
      - uses: actions/checkout@v4

      # Fails fast with an actionable message instead of the cryptic
      # "Username and password required" from docker/login-action.
      - name: Verify ACR secrets are visible to this job
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          missing=0
          for name in ACR_REGISTRY ACR_USERNAME ACR_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty for this job."
              echo "  Check that it exists in the 'prod' environment and that"
              echo "  this job declares 'environment: prod' (it does)."
              echo "  Simpler alternative: store it as a REPOSITORY secret,"
              echo "  which every job can read."
              missing=1
            fi
          done
          exit $missing

      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # ACR image names MUST be <host>/<namespace>/<repo>. A missing namespace,
      # a repo that was never created, or probing with the wrong auth flow all
      # surface as the opaque "denied: requested access to the resource is denied".
      - name: Verify ACR access before push
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          host="${IMAGE%%/*}"
          repo_path="${IMAGE#*/}"
          echo "registry host : $host"
          echo "repository    : $repo_path"

          # 1. The registry part of ACR_REGISTRY must carry the namespace
          case "$repo_path" in
            */*) ;;
            *)
              echo "::error::ACR_REGISTRY is missing the namespace."
              echo "  It must look like <registry-host>/<namespace>:"
              echo "    classic        registry.cn-hangzhou.aliyuncs.com/my-namespace"
              echo "    personal/EE    crpi-xxxxxxxx.cn-shanghai.personal.cr.aliyuncs.com/my-namespace"
              echo "  Without it the image resolves to $host/$repo_path,"
              echo "  which is not a namespace your account owns."
              exit 1
              ;;
          esac

          # 2. GitHub-hosted runners sit outside the Aliyun VPC
          case "$host" in
            *-vpc.* | *.vpc.*)
              echo "::error::'$host' is a VPC endpoint and is unreachable from GitHub runners."
              echo "  Use the public endpoint: registry.<region>.aliyuncs.com"
              exit 1
              ;;
          esac

          # 3. Bearer-token handshake — the same flow `docker push` uses.
          #    A repository endpoint rejects basic auth with 401 even when the
          #    credentials are valid, so probing it directly yields false errors.
          headers=$(curl -s -o /dev/null -D - "https://$host/v2/" || true)
          realm=$(printf '%s' "$headers" | tr -d '\r' \
            | sed -n 's/.*realm="\([^"]*\)".*/\1/p' | head -n1)
          service=$(printf '%s' "$headers" | tr -d '\r' \
            | sed -n 's/.*service="\([^"]*\)".*/\1/p' | head -n1)

          if [ -z "$realm" ]; then
            echo "::warning::ACR sent no token challenge; probing with basic auth."
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -u "$ACR_USERNAME:$ACR_PASSWORD" \
              "https://$host/v2/$repo_path/tags/list" || true)
            echo "GET /v2/$repo_path/tags/list -> HTTP $code (basic auth)"
          else
            echo "token realm   : $realm"
            tcode=$(curl -s -o /tmp/acr-token.json -w '%{http_code}' \
              -u "$ACR_USERNAME:$ACR_PASSWORD" \
              "$realm?service=$service&scope=repository:$repo_path:pull" || true)
            token=$(python3 -c 'import json; d=json.load(open("/tmp/acr-token.json")); print(d.get("token") or d.get("access_token") or "")' 2>/dev/null || true)

            if [ -z "$token" ]; then
              echo "::warning::Token request returned HTTP $tcode; probe inconclusive."
              echo "  Response: $(head -c 300 /tmp/acr-token.json 2>/dev/null | tr -d '\n')"
              echo "  Continuing — the push below is the authoritative test."
              exit 0
            fi

            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $token" \
              "https://$host/v2/$repo_path/tags/list" || true)
            echo "GET /v2/$repo_path/tags/list -> HTTP $code (bearer auth)"
          fi

          # The probe below is advisory only. A repository endpoint can answer
          # 401/404 for a repo that simply has not been created yet — and ACR
          # creates repos on first push — so it must never fail the job. The
          # push itself stays the authoritative test; this just explains it.
          case "$code" in
            200)
              echo "Repository exists and is readable by these credentials."
              ;;
            401 | 403)
              echo "::warning::ACR answered HTTP $code for '$repo_path'."
              echo "  Either the repository does not exist yet, or ACR_USERNAME"
              echo "  has no access to this namespace. If the push below fails,"
              echo "  create 'ali-ecs-docker-build-tutorial-api' under the"
              echo "  namespace in the ACR console and check the account's push"
              echo "  permission."
              ;;
            404)
              echo "::warning::ACR repository '$repo_path' was not found (HTTP 404)."
              echo "  This is often fine: personal-edition ACR creates the"
              echo "  repository on first push. If the push below fails, create"
              echo "  'ali-ecs-docker-build-tutorial-api' in the ACR console."
              ;;
            *)
              echo "::warning::Unexpected HTTP $code from ACR; continuing to push."
              ;;
          esac

      - name: Build image (API + SPA)
        run: |
          docker build \
            -t "$IMAGE:latest" -t "$IMAGE:$IMAGE_TAG" .

      - name: Push image
        run: docker push --all-tags "$IMAGE"

  deploy:
    name: Deploy to Aliyun ECS
    runs-on: ubuntu-latest
    needs: build
    environment: prod
    env:
      IMAGE: ${{ secrets.ACR_REGISTRY }}/ali-ecs-docker-build-tutorial-api
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to ECS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT || 22 }}
          source: 'docker-compose.yml'
          target: ${{ env.DEPLOY_DIR }}

      - name: Pull images & restart containers
        uses: appleboy/ssh-action@v1
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          IMAGE: ${{ env.IMAGE }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT || 22 }}
          envs: ACR_REGISTRY,ACR_USERNAME,ACR_PASSWORD,IMAGE,IMAGE_TAG
          script: |
            set -e

            if [ -z "$ACR_USERNAME" ] || [ -z "$ACR_PASSWORD" ]; then
              echo "ACR_USERNAME / ACR_PASSWORD are empty on this job."
              echo "Store them as REPOSITORY secrets, or declare the same"
              echo "environment on this job if they are environment secrets."
              exit 1
            fi

            # docker login ACR (non-interactive, credentials not persisted)
            echo "$ACR_PASSWORD" | docker login "$ACR_REGISTRY" \
              --username "$ACR_USERNAME" --password-stdin

            # docker pull the image (immutable github.sha tag)
            docker pull "$IMAGE:$IMAGE_TAG"

            # retag to the name docker-compose.yml expects
            docker tag "$IMAGE:$IMAGE_TAG" ali-ecs-docker-build-tutorial-api:latest

            # stop changed containers -> start with the new image
            cd ${{ env.DEPLOY_DIR }}
            docker compose up -d --remove-orphans

            docker image prune -f
            docker logout "$ACR_REGISTRY"

      - name: Health check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT || 22 }}
          script: |
            for i in $(seq 1 10); do
              if curl -fsS http://127.0.0.1:8080/tutorial-api/health > /dev/null; then
                echo "API is healthy"
                break
              fi
              echo "Waiting for API... ($i/10)"
              sleep 5
              if [ "$i" = "10" ]; then
                echo "API health check failed"
                docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
                docker logs --tail 50 ali-ecs-docker-build-tutorial-api
                exit 1
              fi
            done

            # The single image also serves the SPA, so verify the shell too.
            if curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root"'; then
              echo "SPA shell served"
            else
              echo "SPA shell missing from the root route"
              curl -sS -o /dev/null -w 'GET / -> %{http_code}\n' http://127.0.0.1:8080/
              docker logs --tail 50 ali-ecs-docker-build-tutorial-api
              exit 1
            fi
