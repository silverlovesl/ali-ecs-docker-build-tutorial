# =============================================================================
#  CI/CD: push to main -> lint & test -> build & push to ACR -> deploy on ECS
#
#  Flow:
#    GitHub push
#      -> GitHub Actions: docker build
#      -> push image to ACR (tags: latest + github.sha)
#      -> SSH to ECS
#      -> docker login ACR
#      -> docker pull image (by github.sha tag)
#      -> docker compose up -d (recreates changed containers)
#      -> health check
#
#  Secrets must be configured in the GitHub environment named `prod`
#  (Settings -> Environments -> prod), which the `build` and `deploy` jobs
#  declare via `environment: prod`. Repository-level secrets also work.
#
#    ECS_HOST        public IP of the ECS, e.g. 47.xx.xx.xx
#    ECS_USER        SSH user, e.g. root or a deploy user
#    ECS_SSH_KEY     private key whose pubkey is in ~/.ssh/authorized_keys
#    ECS_PORT        (optional) SSH port, defaults to 22
#    ACR_REGISTRY    e.g. registry.cn-hangzhou.aliyuncs.com/my-namespace
#    ACR_USERNAME    ACR username (set in ACR console -> Access Credentials)
#    ACR_PASSWORD    ACR password (fixed password or RAM user credential)
#
#  ACR prerequisites: create TWO repositories under the namespace:
#    ali-ecs-docker-build-tutorial-web  (private) -> full image: $ACR_REGISTRY/ali-ecs-docker-build-tutorial-web:<tag>
#    ali-ecs-docker-build-tutorial-api  (private) -> full image: $ACR_REGISTRY/ali-ecs-docker-build-tutorial-api:<tag>
# =============================================================================
name: CI/CD

on:
  push:
    branches: [feat/auto-deploy, main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_TAG: ${{ github.sha }}
  DEPLOY_DIR: ~/app

# NOTE: IMAGE_WEB / IMAGE_API are defined per job, not here. They embed
# secrets.ACR_REGISTRY, and environment secrets are only readable inside a job
# that declares that environment (see the `environment: prod` keys below).

jobs:
  check:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

  build:
    name: Build & Push to ACR
    runs-on: ubuntu-latest
    needs: check
    # Required: the ACR credentials live in the `prod` environment.
    # If a protection rule requires reviewers, it will also gate this job.
    environment: prod
    env:
      IMAGE_WEB: ${{ secrets.ACR_REGISTRY }}/ali-ecs-docker-build-tutorial-web
      IMAGE_API: ${{ secrets.ACR_REGISTRY }}/ali-ecs-docker-build-tutorial-api
    steps:
      - uses: actions/checkout@v4

      # Fails fast with an actionable message instead of the cryptic
      # "Username and password required" from docker/login-action.
      - name: Verify ACR secrets are visible to this job
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          missing=0
          for name in ACR_REGISTRY ACR_USERNAME ACR_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty for this job."
              echo "  Check that it exists in the 'prod' environment and that"
              echo "  this job declares 'environment: prod' (it does)."
              echo "  Simpler alternative: store it as a REPOSITORY secret,"
              echo "  which every job can read."
              missing=1
            fi
          done
          exit $missing

      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build frontend image
        run: |
          docker build -f apps/web/Dockerfile \
            -t "$IMAGE_WEB:latest" -t "$IMAGE_WEB:$IMAGE_TAG" .

      - name: Build backend image
        run: |
          docker build \
            -t "$IMAGE_API:latest" -t "$IMAGE_API:$IMAGE_TAG" apps/api

      - name: Push frontend image
        run: docker push --all-tags "$IMAGE_WEB"

      - name: Push backend image
        run: docker push --all-tags "$IMAGE_API"

  deploy:
    name: Deploy to Aliyun ECS
    runs-on: ubuntu-latest
    needs: build
    environment: prod
    env:
      IMAGE_WEB: ${{ secrets.ACR_REGISTRY }}/ali-ecs-docker-build-tutorial-web
      IMAGE_API: ${{ secrets.ACR_REGISTRY }}/ali-ecs-docker-build-tutorial-api
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file to ECS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT || 22 }}
          source: 'docker-compose.yml'
          target: ${{ env.DEPLOY_DIR }}

      - name: Pull images & restart containers
        uses: appleboy/ssh-action@v1
        env:
          ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          IMAGE_WEB: ${{ env.IMAGE_WEB }}
          IMAGE_API: ${{ env.IMAGE_API }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT || 22 }}
          envs: ACR_REGISTRY,ACR_USERNAME,ACR_PASSWORD,IMAGE_WEB,IMAGE_API,IMAGE_TAG
          script: |
            set -e

            if [ -z "$ACR_USERNAME" ] || [ -z "$ACR_PASSWORD" ]; then
              echo "ACR_USERNAME / ACR_PASSWORD are empty on this job."
              echo "Store them as REPOSITORY secrets, or declare the same"
              echo "environment on this job if they are environment secrets."
              exit 1
            fi

            # docker login ACR (non-interactive, credentials not persisted)
            echo "$ACR_PASSWORD" | docker login "$ACR_REGISTRY" \
              --username "$ACR_USERNAME" --password-stdin

            # docker pull images (immutable github.sha tag)
            docker pull "$IMAGE_WEB:$IMAGE_TAG"
            docker pull "$IMAGE_API:$IMAGE_TAG"

            # retag to the names docker-compose.yml expects
            docker tag "$IMAGE_WEB:$IMAGE_TAG" ali-ecs-docker-build-tutorial-web:latest
            docker tag "$IMAGE_API:$IMAGE_TAG" ali-ecs-docker-build-tutorial-api:latest

            # stop changed containers -> start with new images
            cd ${{ env.DEPLOY_DIR }}
            docker compose up -d --remove-orphans

            docker image prune -f
            docker logout "$ACR_REGISTRY"

      - name: Health check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: ${{ secrets.ECS_PORT || 22 }}
          script: |
            for i in $(seq 1 10); do
              if curl -fsS http://127.0.0.1:8080/tutorial-api/health > /dev/null; then
                echo "API is healthy"
                exit 0
              fi
              echo "Waiting for API... ($i/10)"
              sleep 5
            done
            echo "API health check failed"
            docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
            docker logs --tail 50 ali-ecs-docker-build-tutorial-api
            exit 1
