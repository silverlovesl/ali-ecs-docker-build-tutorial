# nginx config inside the frontend container (plain HTTP on port 80).
#
# In production the HOST nginx terminates SSL and proxies /tutorial-api to the
# api container; the block below is then unused. It exists so that
# `docker compose up` gives a working stack locally on http://localhost:3001
# without the host nginx.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Proxy API calls to the `api` service on the compose network.
    # 127.0.0.11 is Docker's embedded DNS; resolving via a variable keeps nginx
    # from failing to start if `api` is not up yet.
    location /tutorial-api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets are content-hashed -> cache aggressively
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every unknown route renders index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
